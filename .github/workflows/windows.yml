# Windows identity test on a GitHub Windows runner (idea I8, 2026-10-16): the plugin DLL cross-built with mingw-w64 exactly as `./build.sh --windows`,
# loaded into an official llama.cpp Windows release (CPU build) through GGML_BACKEND_PATH, compared token by token with stock by tools/windows_test.ps1
# with the cache on and forced to evict. Would have caught both Windows-only bugs the MSI Claw found (DLL imports, uncommitted compute buffer).
# Also: src/platform.h tests natively, and the launcher (check, dry run, core detection) on real Windows. Manual and nightly, like identity.yml.
name: windows

on:
  workflow_dispatch:
  push:
    branches: [windows-ci]    # run it on any commit: git push origin <commit>:refs/heads/windows-ci
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

env:
  LLAMA_RELEASE: b11669       # the release the MSI Claw used (ggml 0.27.0, backend API 3)

jobs:
  dll:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: mingw-w64 (UCRT when available, the C runtime of official llama.cpp and of the kit; else posix/msvcrt)
        run: |
          sudo apt-get update -q
          if sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-ucrt64 binutils-mingw-w64-x86-64 2>/dev/null && command -v x86_64-w64-mingw32ucrt-g++; then
            echo "MINGW_CXX=x86_64-w64-mingw32ucrt-g++" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
            echo "MINGW_CXX=x86_64-w64-mingw32-g++" >> "$GITHUB_ENV"
          fi
      - name: Plugin DLL (API 3, with debug info for crash offsets; same code) and the platform test, warnings are errors
        shell: bash     # -eo pipefail: an objdump failure must not leave an empty import list that passes
        run: |
          $MINGW_CXX --version | head -1
          $MINGW_CXX -std=c++17 -Wall -Werror -Wno-unused-function -Ithird_party/ggml-v3/include -Ithird_party/ggml-v3/src -fsyntax-only src/moe_cache_plugin.cpp
          GGML_API=3 MOE_CACHE_CXXFLAGS="-g" ./build.sh --windows
          x86_64-w64-mingw32-objdump -p build/win/ggml-moe-cache.dll | grep "DLL Name" | tee build/win/imports_dlls.txt
          # only system DLLs and llama.cpp's own ggml DLLs may be imported (libwinpthread-1.dll kept it from loading on the Claw)
          grep -q -i "KERNEL32" build/win/imports_dlls.txt || { echo "FAIL: no import list (objdump?)"; exit 1; }
          if grep -v -i -E "KERNEL32|api-ms-win-crt|msvcrt|ggml-base.dll|ggml.dll|USER32|ADVAPI32" build/win/imports_dlls.txt; then
            echo "FAIL: the DLL imports a DLL that is not a system or ggml DLL"; exit 1; fi
          $MINGW_CXX -std=c++17 -O2 -Isrc tests/platform_test.cpp -o build/win/platform_test.exe -static
          $MINGW_CXX -std=c++17 -O2 -Wall -Werror -Isrc tests/win_read_bench.cpp -o build/win/win_read_bench.exe -static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: win-dll
          path: |
            build/win/ggml-moe-cache.dll
            build/win/platform_test.exe
            build/win/win_read_bench.exe

  windows:
    needs: dll
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: win-dll
          path: dll

      - name: Platform layer natively (reserve / commit / decommit, unbuffered reads, limits)
        run: |
          Push-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\dll\platform_test.exe"
          if ($LASTEXITCODE -ne 0) { throw "platform_test failed" }
          Pop-Location

      - name: Official llama.cpp release (CPU) and the small MoE model
        run: |
          $zip = "llama-$env:LLAMA_RELEASE-bin-win-cpu-x64.zip"
          Invoke-WebRequest -UseBasicParsing "https://github.com/ggml-org/llama.cpp/releases/download/$env:LLAMA_RELEASE/$zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath llama
          $srv = Get-ChildItem -Recurse llama -Filter llama-server.exe | Select-Object -First 1
          "LLAMA_DIR=$($srv.DirectoryName)" | Out-File -Append $env:GITHUB_ENV
          Get-ChildItem $srv.DirectoryName -Filter "ggml*.dll" | ForEach-Object { $_.Name }
          Invoke-WebRequest -UseBasicParsing "https://huggingface.co/bartowski/granite-3.1-1b-a400m-instruct-GGUF/resolve/main/granite-3.1-1b-a400m-instruct-Q4_K_M.gguf" -OutFile granite.gguf
          $h = (Get-FileHash granite.gguf -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "3a2ec1c2a78cb29d901e29bbf5162dcd03381e13803d2cbdcff838d4d08142eb") { throw "granite.gguf: wrong sha256 $h" }

      - name: Launcher on Windows (check, dry run, core detection for pinning)
        run: |
          $env:MOE_CACHE_LIB = "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll"
          $ls = "$env:LLAMA_DIR\llama-server.exe"
          python bin/moe_cache.py check granite.gguf --llama-server $ls --run | Tee-Object launcher_check.txt
          if (-not (Select-String launcher_check.txt -Pattern "plugin loads .*yes" -Quiet)) { throw "check: the plugin does not load" }
          if (-not (Select-String launcher_check.txt -Pattern "cache runs .*yes" -Quiet)) { throw "check --run: the cache did not compute" }
          python bin/moe_cache.py server granite.gguf --llama-server $ls --ram 4 --always-plugin --gpu-cache 1000 --dry-run 2>&1 | Tee-Object launcher_dry.txt
          if (-not (Select-String launcher_dry.txt -Pattern "GGML_BACKEND_PATH" -SimpleMatch -Quiet)) { throw "dry run: no GGML_BACKEND_PATH" }
          if (Select-String launcher_dry.txt -Pattern "moe-cache-mib" -SimpleMatch -Quiet) { throw "dry run: --gpu-cache must be dropped on path loading (wrong tokens there)" }
          python -c "import importlib.util as u, sys; sys.argv=['x']; s=u.spec_from_file_location('m','bin/moe_cache.py'); m=u.module_from_spec(s); s.loader.exec_module(m); c=m.win_cores(); print('cores (efficiency class, cpus):', c); print('hybrid masks:', m.hybrid_masks(c)); print('ggml API of the server:', m.ls_api(r'$ls')); sys.exit(0 if c else 1)"
          python tests/ui_test.py       # control page (GUI1) without a model
          if ($LASTEXITCODE -ne 0) { throw "control page test failed" }

      - name: Launcher real start with --ram (Windows job memory limit, WP3) and --agent (tool call, connect)
        run: |
          $env:MOE_CACHE_LIB = "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll"
          $ls = "$env:LLAMA_DIR\llama-server.exe"
          $p = Start-Process python -ArgumentList "bin/moe_cache.py","server","granite.gguf","--llama-server",$ls,"--ram","3","--always-plugin","--agent","--ctx","4096","--port","8090" -RedirectStandardError launcher_real.err -RedirectStandardOutput launcher_real.out -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8090/health).StatusCode -eq 200) { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          $body = '{"model":"granite","messages":[{"role":"user","content":"Say hi"}],"max_tokens":8,"temperature":0}'
          $key = (python bin/moe_cache.py key | Out-String).Trim()     # agent mode servers need the per-user key (option C, b6dce47)
          if (-not $key) { throw "agent mode server but moe_cache.py key printed nothing" }
          if ($ok) { (Invoke-WebRequest -UseBasicParsing -Method Post -ContentType application/json -Headers @{ Authorization = "Bearer $key" } -Body $body http://127.0.0.1:8090/v1/chat/completions).Content }
          python bin/moe_cache.py connect opencode --url http://127.0.0.1:8090 --write --config "$env:RUNNER_TEMP\opencode.json"
          Get-Content "$env:RUNNER_TEMP\opencode.json"
          Stop-Process -Id $p.Id
          Start-Sleep 3
          Get-Content launcher_real.err | Select-String "moe-cache:" | Select-Object -First 30
          if (-not $ok) { throw "the launcher's server never became ready" }
          if (-not (Select-String launcher_real.err -Pattern "Windows job memory limit 3.0 GB" -SimpleMatch -Quiet)) { throw "--ram did not set a job memory limit" }
          if (-not (Select-String launcher_real.err -Pattern "cache mode" -SimpleMatch -Quiet)) { throw "the plugin's cache was not on" }
          if (-not (Select-String "$env:RUNNER_TEMP\opencode.json" -Pattern '"tool_call": true' -SimpleMatch -Quiet)) { throw "connect opencode wrote no model entry" }

      - name: Control page with the model (GUI1; start, one request, live hit rate via the named event, stop through the page)
        run: |
          $env:MOE_CACHE_LIB = "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll"
          python tests/ui_live.py granite.gguf --llama-server "$env:LLAMA_DIR\llama-server.exe"
          if ($LASTEXITCODE -ne 0) { throw "control page with the model failed" }

      - name: On-demand endpoint (fake server, then Granite; then autostart in the Startup folder, installed and removed)
        run: |
          $env:MOE_CACHE_LIB = "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll"
          $ls = "$env:LLAMA_DIR\llama-server.exe"
          python tests/on_demand_test.py
          if ($LASTEXITCODE -ne 0) { throw "on-demand test failed" }
          python tests/on_demand_live.py granite.gguf --llama-server $ls
          if ($LASTEXITCODE -ne 0) { throw "on-demand live test failed" }
          $env:XDG_CACHE_HOME = "$env:RUNNER_TEMP\od-cache"; $env:APPDATA = "$env:RUNNER_TEMP\od-appdata"
          python bin/moe_cache.py on-demand granite.gguf --llama-server $ls --ram 3 --ctx 4096 --always-plugin --port 8094 --install-autostart
          if ($LASTEXITCODE -ne 0) { throw "on-demand --install-autostart failed" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\moe-cache on-demand.lnk"
          if (-not (Test-Path $lnk)) { throw "no Startup shortcut" }
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8094/health).Content -match "on_demand") { $ok = $true; break } } catch {} ; Start-Sleep 1 }
          if (-not $ok) { throw "the listener started by --install-autostart does not answer" }
          $key = (python bin/moe_cache.py key | Out-String).Trim()
          $body = '{"messages":[{"role":"user","content":"Say hi"}],"max_tokens":8,"temperature":0}'
          (Invoke-WebRequest -UseBasicParsing -Method Post -ContentType application/json -Headers @{ Authorization = "Bearer $key" } -Body $body http://127.0.0.1:8094/v1/chat/completions).Content
          python bin/moe_cache.py on-demand --status
          python bin/moe_cache.py on-demand --remove-autostart
          Start-Sleep 3
          if (Test-Path $lnk) { throw "--remove-autostart left the shortcut" }
          $up = $true; try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8094/health | Out-Null } catch { $up = $false }
          if ($up) { throw "--remove-autostart did not stop the listener" }
          if (Get-Process llama-server -ErrorAction SilentlyContinue) { throw "llama-server still runs after the listener was stopped" }
          Get-Content "$env:XDG_CACHE_HOME\moe-cache\on-demand-listener.log"

      - name: One-click start (bin\moe-cache-ui.bat finds Python, the plugin DLL in build\win-api3 and llama-server, and serves the page)
        run: |
          New-Item -ItemType Directory -Force build\win-api3 | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll" build\win-api3\ggml-moe-cache.dll
          $env:LLAMA_SERVER = "$env:LLAMA_DIR\llama-server.exe"
          Remove-Item Env:MOE_CACHE_LIB -ErrorAction SilentlyContinue
          $p = Start-Process cmd -ArgumentList "/c","bin\moe-cache-ui.bat","--no-browser","--ui-port","8078" -RedirectStandardOutput ui_bat.out -RedirectStandardError ui_bat.err -PassThru -NoNewWindow
          $sys = $null
          $tok = $null
          for ($i = 0; $i -lt 60 -and -not $tok; $i++) { Start-Sleep 1; $m = Select-String ui_bat.out -Pattern '\?t=([A-Za-z0-9_-]+)' -ErrorAction SilentlyContinue; if ($m) { $tok = $m.Matches[0].Groups[1].Value } }
          for ($i = 0; $i -lt 30 -and $tok; $i++) { try { $sys = Invoke-RestMethod http://127.0.0.1:8078/api/system -Headers @{ "X-MoeCache-Token" = $tok }; break } catch { Start-Sleep 1 } }
          taskkill /T /F /PID $p.Id | Out-Null
          Get-Content ui_bat.out, ui_bat.err
          if (-not $sys) { throw "the page did not come up" }
          "plugin: $($sys.plugin)"; "llama-server: $($sys.llama_server)"
          if (-not ($sys.plugin -like "*build\win-api3\ggml-moe-cache.dll")) { throw "the .bat did not find the DLL in build\win-api3" }
          if ($sys.llama_server -ne $env:LLAMA_SERVER) { throw "the page does not use LLAMA_SERVER" }
          # --shortcut from a folder with a single quote in its name (the PowerShell string must stay intact)
          $d = Join-Path $env:RUNNER_TEMP "o'brien kit"; New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item bin\moe-cache-ui.bat $d
          cmd /c "`"$d\moe-cache-ui.bat`" --shortcut"
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) "moe-cache.lnk"
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          "shortcut -> $t"
          if ($t -ne (Join-Path $d "moe-cache-ui.bat")) { throw "--shortcut: wrong target ($t)" }
          Remove-Item $lnk

      - name: Crash dumps on (Windows Error Reporting LocalDumps for llama-server.exe)
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dumps" | Out-Null
          $k = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\llama-server.exe"
          New-Item -Force $k | Out-Null
          New-ItemProperty -Force $k -Name DumpFolder -PropertyType ExpandString -Value "$env:GITHUB_WORKSPACE\dumps" | Out-Null
          New-ItemProperty -Force $k -Name DumpType -PropertyType DWord -Value 1 | Out-Null

      - name: Identity, cache on and forced to evict (0.2 GiB)
        run: |
          powershell -ExecutionPolicy Bypass -File tools/windows_test.ps1 -LlamaDir $env:LLAMA_DIR -Model "$env:GITHUB_WORKSPACE\granite.gguf" -Dll "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll" -CacheGiB 0.2 -Tokens 24 -Ctx 2048
          if ($LASTEXITCODE -ne 0) { throw "windows_test.ps1 failed ($LASTEXITCODE)" }

      - name: Identity, private-memory cache (MOE_CACHE_WIN_VIEW=0, the Windows path before RESULTS 59), cache forced to evict
        run: |
          $env:MOE_CACHE_WIN_VIEW = "0"
          powershell -ExecutionPolicy Bypass -File tools/windows_test.ps1 -LlamaDir $env:LLAMA_DIR -Model "$env:GITHUB_WORKSPACE\granite.gguf" -Dll "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll" -CacheGiB 0.2 -Tokens 24 -Ctx 2048
          if ($LASTEXITCODE -ne 0) { throw "windows_test.ps1 (private memory) failed ($LASTEXITCODE)" }
          if (Select-String "$env:TEMP\moe-cache-test\plugin.err.txt" -Pattern "read-only views of the model file" -Quiet) { throw "MOE_CACHE_WIN_VIEW=0 did not turn the file view off" }

      - name: Identity, Windows file-view cache (the default, idea I47), cache forced to evict, executor byte-checked
        run: |
          $env:MOE_CACHE_EXEC = "2"; $env:MOE_CACHE_EXEC_CHECK = "1"
          powershell -ExecutionPolicy Bypass -File tools/windows_test.ps1 -LlamaDir $env:LLAMA_DIR -Model "$env:GITHUB_WORKSPACE\granite.gguf" -Dll "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll" -CacheGiB 0.2 -Tokens 24 -Ctx 2048 -Extra "--no-repack"
          if ($LASTEXITCODE -ne 0) { throw "windows_test.ps1 (file view) failed ($LASTEXITCODE)" }
          $log = "$env:TEMP\moe-cache-test\plugin.err.txt"
          Select-String $log -Pattern "MOE_CACHE_WIN_VIEW|evictions|executor ran" | ForEach-Object { $_.Line }
          if (-not (Select-String $log -Pattern "experts are kept in read-only views of the model file" -Quiet)) { throw "the file-view cache was not used" }
          $m = Select-String $log -Pattern '"evictions":(\d+)' | Select-Object -Last 1
          if (-not $m -or [int64]$m.Matches[0].Groups[1].Value -eq 0) { throw "no evictions: the 0.2 GiB cache did not cycle experts through the views ($($m.Line))" }
          $x = Select-String $log -Pattern '"exec_checked":(\d+),"exec_mismatch":(\d+)' | Select-Object -Last 1
          if (-not $x -or [int64]$x.Matches[0].Groups[1].Value -eq 0 -or [int64]$x.Matches[0].Groups[2].Value -ne 0) { throw "executor byte check on the views: none checked or mismatches ($($x.Line))" }

      - name: Identity, executor forced on and byte-checked (no repacking on both servers, else the executor steps aside)
        run: |
          $env:MOE_CACHE_EXEC = "2"; $env:MOE_CACHE_EXEC_CHECK = "1"
          powershell -ExecutionPolicy Bypass -File tools/windows_test.ps1 -LlamaDir $env:LLAMA_DIR -Model "$env:GITHUB_WORKSPACE\granite.gguf" -Dll "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll" -CacheGiB 0.2 -Tokens 24 -Ctx 2048 -Extra "--no-repack"
          if ($LASTEXITCODE -ne 0) { throw "windows_test.ps1 (executor) failed ($LASTEXITCODE)" }
          $log = "$env:TEMP\moe-cache-test\plugin.err.txt"
          Select-String $log -Pattern "executor=|moe-cache: CPU weight" | ForEach-Object { $_.Line }
          if (Select-String $log -Pattern "CPU weight repacking on" -SimpleMatch -Quiet) { throw "the plugin repacked although llama-server had --no-repack (stock did not)" }
          if (-not (Select-String $log -Pattern "executor=on" -Quiet)) { throw "the executor did not run" }
          $m = Select-String $log -Pattern '"exec_checked":(\d+),"exec_mismatch":(\d+)' | Select-Object -Last 1
          if (-not $m -or [int64]$m.Matches[0].Groups[1].Value -eq 0 -or [int64]$m.Matches[0].Groups[2].Value -ne 0) { throw "executor byte check: none checked or mismatches ($($m.Line))" }

      - name: On failure - crash event and the faulting stack (map plugin offsets with x86_64-w64-mingw32-addr2line -e ggml-moe-cache.dll)
        if: failure()
        run: |
          Get-WinEvent -FilterHashtable @{ LogName = "Application"; ProviderName = "Application Error" } -MaxEvents 3 -ErrorAction SilentlyContinue |
            ForEach-Object { $_.TimeCreated; $_.Message; "----" }
          $cdb = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          foreach ($d in (Get-ChildItem "$env:GITHUB_WORKSPACE\dumps" -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 2)) {
            "dump: $($d.Name)"
            if ($cdb) { & $cdb.FullName -z $d.FullName -c ".ecxr; r; kn 40; lmv m ggml*; q" 2>&1 | Select-Object -Last 120 } else { "cdb not found" }
          }

      - name: Collect the logs (windows_test.ps1 writes them to %TEMP%\moe-cache-test)
        if: always()
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Copy-Item "$env:TEMP\moe-cache-test\*.txt" logs -ErrorAction SilentlyContinue
          Copy-Item launcher_*.txt logs -ErrorAction SilentlyContinue
          Copy-Item "$env:GITHUB_WORKSPACE\dumps\*.dmp" logs -ErrorAction SilentlyContinue
          Copy-Item "$env:GITHUB_WORKSPACE\dll\ggml-moe-cache.dll" logs
          Get-ChildItem logs | ForEach-Object { $_.Name }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-logs
          path: logs
