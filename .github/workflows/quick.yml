# Quick checks on every push (external audit XA-6, 2026-10-30): a few minutes, no model, no llama.cpp build. The full identity / windows / sanitize
# workflows stay one batch before a release (owner's rule); this tier catches broken tests, syntax and the buffer-field guard right away.
name: quick

on:
  push:
    branches: [experimental, main]
  pull_request:                  # AUD-001: an outside PR gets the model-free checks too (no secrets are used; permissions are read-only)
    branches: [experimental, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.tested.outputs.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record the commit this job tests
        id: tested
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Plugin syntax with both header sets (warnings are errors), buffer-field guard
        run: |
          for H in third_party/ggml third_party/ggml-v3; do g++ -std=c++17 -Wall -Werror -Wno-unused-function -I$H/include -I$H/src -fsyntax-only src/moe_cache_plugin.cpp; done
          if grep -nE '\w*(buffer|buf)->(buft|context|size|usage|iface)\b|->buffer->|\w*buf\w*->iface|->iface\.get_name' src/*.inl src/*.cpp; then echo "FAIL: read ggml buffer fields through the public API"; exit 1; fi
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/args_test.cpp -o /tmp/args_test && /tmp/args_test
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/tested_ggml_test.cpp -o /tmp/tested_ggml_test && /tmp/tested_ggml_test    # which ggml builds count as tested (version or version@commit)
          g++ -std=c++17 -O1 -Wall -Werror -Isrc -Ithird_party/ggml-v3/include -Ithird_party/ggml-v3/src tests/rebalance_test.cpp -o /tmp/rebalance_test -lpthread && /tmp/rebalance_test   # BO-2 choice logic
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/peers_test.cpp -o /tmp/peers_test && /tmp/peers_test    # N2: peer registry rules (fake peers)
          g++ -std=c++17 -Wall -Werror -Wno-unused-function -Isrc tests/sigbus_test.cpp -o /tmp/sigbus_test && /tmp/sigbus_test    # A1-04: a model file cut short while mapped says what happened
          g++ -std=c++17 -Wall -Werror -Wno-unused-function -Isrc tests/file_view_load_test.cpp -o /tmp/fvl_test && /tmp/fvl_test    # CACHE-685: a file cut short under the view is a false return, not a SIGBUS
          g++ -std=c++17 -Wall -Werror -Wno-unused-function -DMOE_CACHE_TEST_NO_POPULATE -Isrc tests/file_view_load_test.cpp -o /tmp/fvl_test2 && /tmp/fvl_test2    # the same through the guarded page touch (kernels without MADV_POPULATE_READ)
          # 2026-11-03 audit fixes: each is a standalone program (no ggml, no model)
          for t in env_flag gpu_guard shared_gpu read_retry exit ident pack_check lend profile_path; do
            g++ -std=c++17 -Wall -Wextra -Werror -Wno-unused-function -Isrc tests/${t}_test.cpp -o /tmp/${t}_test -lpthread && /tmp/${t}_test
          done
          for t in wake_pipe reserve_msg; do      # these two include platform.h without -Wextra
            g++ -std=c++17 -Wall -Werror -Wno-unused-function -Isrc tests/${t}_test.cpp -o /tmp/${t}_test -lpthread && /tmp/${t}_test
          done

      - name: "Model-free tests (fake servers; the list lives in tools/run_quick_tests.sh - py_compile, every tests/*_test.py, apply_llama_patches_test.sh)"
        env:
          REQUIRE_NODE: "1"       # AUD-094: ui_test skips its JavaScript checks without node; the script then runs tests/require_node_test.py, which fails instead
        run: tools/run_quick_tests.sh

      - name: Model catalogue (docs/MODELS.md is generated from models.json)
        run: |
          python3 tools/gen_models_md.py --check
          python3 - <<'PY'
          import sys; sys.path.insert(0, "bin")
          import moe_cache_catalogue as c
          p = c.problems(c.load()); print("\n".join(p) or "models.json ok"); sys.exit(1 if p else 0)
          PY

      - name: Published numbers have claims (benchmarks/; WARN mode until every current number has a claim)
        run: |
          python3 bin/moe_cache.py bench-record lint --warn
          python3 bin/moe_cache.py bench-record board --check || echo "::warning::benchmarks/BOARD.md is out of date: run bench-record board"

      - name: README card block matches docs/benchmark_card.html
        run: python3 tools/card_markdown.py --check

      - name: Scoop bucket push (local empty bucket repo; first push, unchanged, next version)
        run: |
          set -e; T=$(mktemp -d); git init -q --bare -b main "$T/b.git"
          sed 's/@VERSION@/9.9.8/g;s/@SHA256@/0/g' packaging/scoop/moe-cache.json > "$T/m.json"
          SCOOP_BUCKET_TOKEN=dummy tools/publish_scoop.sh "file://$T/b.git" "$T/m.json" | grep -q "9.9.8 pushed"
          tools/publish_scoop.sh "file://$T/b.git" "$T/m.json" | grep -q "nothing to push"
          sed -i 's/9\.9\.8/9.9.9/g' "$T/m.json"; tools/publish_scoop.sh "file://$T/b.git" "$T/m.json" | grep -q "9.9.9 pushed"
          [ "$(git --git-dir="$T/b.git" rev-list --count main)" = 2 ] && git --git-dir="$T/b.git" show main:bucket/moe-cache.json | grep -q '"version": "9.9.9"'

      - name: Shell scripts parse
        run: for f in install.sh build.sh bin/moe-cache-* bin/_moe_cache_env.sh tests/*.sh tools/*.sh; do case "$f" in *.bat) continue;; esac; bash -n "$f"; done

  # RELEASE-687: the release gate must know WHICH commit this run tested, not only which commit the run was started on (a run started on one branch
  # can test another ref through the `ref` input). This job runs only when every job above passed and they all tested the same commit; it keeps that
  # commit in the artifact `tested-sha`, which tools/release_gate.sh compares with the tag's commit.
  record:
    needs: [quick]
    runs-on: ubuntu-24.04
    steps:
      - name: Write tested-sha.txt
        shell: bash
        run: |
          set -e
          n=0; first=""
          for s in ${{ needs.quick.outputs.sha }}; do
            [ -n "$s" ] || { echo "a job did not report the commit it tested"; exit 1; }
            [ -z "$first" ] || [ "$s" = "$first" ] || { echo "the jobs tested different commits ($first, $s)"; exit 1; }
            first="$s"; n=$((n+1))
          done
          echo "$first" | grep -Eq '^[0-9a-f]{40}$' || { echo "not a commit: $first"; exit 1; }
          echo "$first" > tested-sha.txt; echo "tested $first ($n job(s))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-sha
          path: tested-sha.txt
