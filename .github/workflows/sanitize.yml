# Sanitizer runs (idea I9, 2026-10-15): llama.cpp and the plugin built with ThreadSanitizer, then with AddressSanitizer, on the hardest identity setups
# (forced eviction, executor forced on, background reads delayed). A sanitizer report that names plugin code fails the job; reports only inside llama.cpp
# are printed but do not fail it (not ours to fix). Manual and weekly: it is slow (instrumented builds).
name: sanitize

on:
  workflow_dispatch:
  push:
    branches: [sanitize]      # run it on any commit: git push origin <commit>:refs/heads/sanitize (workflow_dispatch needs the file on main first)
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        san: [thread, address]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Packages
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build

      - name: llama.cpp 23b0202a1 with the ${{ matrix.san }} sanitizer (CPU only, shared libraries)
        run: |
          S=$(echo ${{ matrix.san }} | tr a-z A-Z)
          git init llama.cpp && cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin 23b0202a189c44a54625aadcb37a946dd1d6278d
          git checkout --detach FETCH_HEAD
          # TSan: backends as files (GGML_BACKEND_DL=ON) so the plugin is dlopen'ed after start-up through GGML_BACKEND_PATH. Preloaded, the server
          # segfaulted at start with an empty log, also with libtsan preloaded first (likely cause: the portable plugin does not link libggml-base, so its
          # constructor can run before the TSan-built ggml libraries are initialised). ASan works preloaded and keeps that setup.
          DL=OFF; TARGETS=llama-server
          if [ ${{ matrix.san }} = thread ]; then DL=ON; TARGETS="llama-server ggml-cpu"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_SHARED_LIBS=ON -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON \
                -DGGML_BACKEND_DL=$DL -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF -DGGML_OPENMP=OFF \
                -DLLAMA_SANITIZE_$S=ON -DGGML_SANITIZE_$S=ON
          cmake --build build --target $TARGETS -j "$(nproc)"
          ls build/bin

      - name: Plugin with the same sanitizer
        run: |
          export GGML_API=3
          MOE_CACHE_CXXFLAGS="-fsanitize=${{ matrix.san }} -g -fno-omit-frame-pointer" ./build.sh --portable
          ls -la build/libggml-moe-cache.so

      - name: Small MoE model
        run: |
          curl -L -f -s -o granite.gguf https://huggingface.co/bartowski/granite-3.1-1b-a400m-instruct-GGUF/resolve/main/granite-3.1-1b-a400m-instruct-Q4_K_M.gguf
          echo "3a2ec1c2a78cb29d901e29bbf5162dcd03381e13803d2cbdcff838d4d08142eb  granite.gguf" | sha256sum -c -

      - name: Identity under the sanitizer (eviction, executor forced, reads delayed)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_KEEP: ident_san
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2 MOE_CACHE_EXEC_CHECK=1 MOE_CACHE_TEST_READ_DELAY_US=500"
          TSAN_OPTIONS: "halt_on_error=0 report_signal_unsafe=0 second_deadlock_stack=1"
          ASAN_OPTIONS: "detect_leaks=0 halt_on_error=0"
        run: |
          # LD_PRELOAD loads the plugin before the executable's own libraries, so its sanitizer runtime must be preloaded first (else the plugin's
          # instrumented start-up code runs before the runtime exists: segfault with an empty log, first run of this workflow)
          if [ ${{ matrix.san }} = thread ]; then
            export METHOD=path          # see the build step: dlopen after start-up instead of LD_PRELOAD
          else
            RT=$(gcc -print-file-name=libasan.so)
            export MOE_CACHE_LIB="$RT:$MOE_CACHE_LIB"
          fi
          echo "plugin: $MOE_CACHE_LIB (method ${METHOD:-auto})"
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_san.txt || true
          echo "---- sanitizer reports in the plugin server log:"
          grep -c -E "WARNING: ThreadSanitizer|ERROR: AddressSanitizer" ident_san/plugin.log || true
          # a report fails the job only when one of its stack frames is plugin code
          python3 - ident_san/plugin.log <<'PY'
          import re, sys
          txt = open(sys.argv[1], errors="replace").read()
          reports = re.split(r"(?=WARNING: ThreadSanitizer|==\d+==ERROR: AddressSanitizer)", txt)[1:]
          ours = [r for r in reports if re.search(r"mc_[a-z]+\.inl|moe_cache_plugin\.cpp|platform\.h|libggml-moe-cache", r[:6000])]
          print(f"{len(reports)} sanitizer reports, {len(ours)} in plugin code")
          for r in ours[:5]:
              print(r[:3000]); print("....")
          sys.exit(1 if ours else 0)
          PY
          grep -q "PASS" identity_san.txt || { echo "FAIL: not identical under the sanitizer"; exit 1; }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitize-${{ matrix.san }}
          path: |
            identity_san.txt
            ident_san/plugin.log
