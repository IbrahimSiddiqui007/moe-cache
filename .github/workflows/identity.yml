# Token-identity gate on a GitHub runner (no GPU, no big model): builds llama.cpp CPU-only at each supported pin, builds the plugin for that pin,
# downloads a small MoE (Granite 3.1 1B-A400M Q4_K_M, sha256-checked) and checks that stock and plugin produce identical tokens
# with the cache forced to evict (0.2 GiB) and with the executor forced on and byte-checked (repacking off, or the executor steps aside),
# and that llama-perplexity's logits at batch 8 are the same (KL divergence 0) with eviction and the executor together.
#   Actions tab -> identity -> Run workflow   (also runs daily, 05:00 UTC). The "master" row builds llama.cpp's newest commit: an early warning
#   when upstream changes something the plugin depends on (it may fail without the release being broken).
name: identity

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    continue-on-error: ${{ matrix.name == 'master-api3' }}
    defaults:
      run:
        shell: bash          # bash -eo pipefail: a FAIL from identity.sh must fail the step even through tee
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "ggml-0.25-api2", sha: "7fe450e19305b828c199d602c23a8337aaa1f03b", api: "2" }
          - { name: "ggml-0.26-api3", sha: "23b0202a189c44a54625aadcb37a946dd1d6278d", api: "3" }
          - { name: "master-api3", sha: "master", api: "3" }
    steps:
      - uses: actions/checkout@v4

      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git curl ca-certificates python3

      - name: llama.cpp at the pin (CPU only, shared libraries)
        run: |
          git init llama.cpp && cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp
          git fetch --depth 1 origin "${{ matrix.sha }}"
          git checkout --detach FETCH_HEAD
          git log -1 --format='%H %s'
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_CUDA=OFF -DGGML_NATIVE=OFF -DGGML_AVX2=ON \
                -DGGML_BACKEND_DL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF
          cmake --build build --target llama-server llama-perplexity llama-quantize -j "$(nproc)"

      - name: Plugin for this pin (warnings are errors)
        run: |
          if [ "${{ matrix.api }}" = 3 ]; then export GGML_API=3; H=third_party/ggml-v3; else H=third_party/ggml; fi
          g++ -std=c++17 -Wall -Werror -Wno-unused-function -I$H/include -I$H/src -fsyntax-only src/moe_cache_plugin.cpp
          g++ -std=c++17 -Wall -Wextra -Werror -Isrc tests/args_test.cpp -o /tmp/args_test && /tmp/args_test    # the llama-server flags the plugin mirrors
          ./build.sh --portable
          ls -la build/libggml-moe-cache.so

      - name: Small MoE model
        run: |
          curl -L -f -s -o granite.gguf https://huggingface.co/bartowski/granite-3.1-1b-a400m-instruct-GGUF/resolve/main/granite-3.1-1b-a400m-instruct-Q4_K_M.gguf
          echo "3a2ec1c2a78cb29d901e29bbf5162dcd03381e13803d2cbdcff838d4d08142eb  granite.gguf" | sha256sum -c -

      - name: Launcher (bin/moe_cache.py) - dry run and check, the bash wrappers call it
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
        run: |
          python3 -m py_compile bin/moe_cache.py
          bin/moe-cache-server granite.gguf --ram 4 --fast --dry-run | tee launcher_dry.txt
          grep -qE "^env .*MOE_CACHE_SIZE_GIB=auto .*MOE_CACHE_ROUTE=skip .*llama-server -m granite.gguf .*--n-cpu-moe" launcher_dry.txt
          bin/moe-cache-check granite.gguf --run | tee launcher_check.txt
          grep -q "plugin loads .*yes" launcher_check.txt
          grep -q "cache runs .*yes: one request in cache mode" launcher_check.txt     # I26: the cache really computed
          # --gpu-cache with the plugin loaded as a file (GGML_BACKEND_PATH) would give wrong tokens: the launcher must drop it (T7, B1)
          bin/moe-cache-server granite.gguf --ram 4 --always-plugin --load-method path --gpu-cache 1000 --dry-run 2>&1 | tee launcher_gcache_path.txt
          grep -q "gpu-cache needs a llama-server that links its backends directly" launcher_gcache_path.txt
          if grep -q "moe-cache-mib" launcher_gcache_path.txt; then echo "FAIL: --moe-cache-mib passed on path loading (T7)"; exit 1; fi    # "! grep" alone never fails under bash -e
          python3 tests/planner_test.py granite.gguf | tee launcher_planner.txt
          python3 tests/ui_test.py      # control page (GUI1): model list, plan reasons, start/stop, live stats; fake models and server

      - name: Control page with the model (GUI1; start, one request, live hit rate, stop through the page)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
        run: python3 tests/ui_live.py granite.gguf --llama-server "$LLAMA_SERVER"

      - name: API key and CORS (option C; agent mode needs the stored key, a plain server allows only localhost origins)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
        run: python3 tests/key_live.py granite.gguf --llama-server "$LLAMA_SERVER" | tee key_live.txt

      - name: Identity, cache forced to evict (0.2 GiB)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2"
        run: tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_evict.txt

      - name: llama.cpp built the way install.sh, official releases and Windows are (backends as files, CPU variants) - 0.26 row only
        if: matrix.name == 'ggml-0.26-api3'
        run: |
          cmake -S llama.cpp -B llama.cpp/build-dl -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_CUDA=OFF -DGGML_NATIVE=OFF \
                -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build-dl --target llama-server ggml-cpu-haswell -j "$(nproc)"   # AVX2: every GitHub runner has it; one variant is enough
          ls llama.cpp/build-dl/bin/ | grep -E "ggml-cpu|llama-server"

      - name: Path loading (GGML_BACKEND_PATH, the official way), cache forced to evict, with MOE_CACHE_GPU_CACHE=1 - the plugin must refuse that mode (wrong tokens there before, T7)
        if: matrix.name == 'ggml-0.26-api3'
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build-dl/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          METHOD: path
          IDENT_KEEP: ident_small_path
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_GPU_CACHE=1"
        run: |
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_path_gcache.txt
          grep "moe-cache:" ident_small_path/plugin.log | head -6
          grep -q "MOE_CACHE_GPU_CACHE=1 ignored" ident_small_path/plugin.log
          grep -q "load=GGML_BACKEND_PATH .*gpu_cache_host_buffer=off" ident_small_path/plugin.log

      - name: Identity on long prompts (prompt batches of 512+ tokens load scan-resistant by default, I3)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2"
        run: tests/identity.sh granite.gguf --long --tokens 24 --ctx 4096 --n-cpu-moe 999 | tee identity_long_scan.txt

      - name: Identity, executor forced on and byte-checked
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_EXTRA: "--no-repack"      # CPU weight repacking would make the executor step aside (repacked weights); both servers get the flag
          IDENT_KEEP: ident_exec
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2 MOE_CACHE_EXEC_CHECK=1"
        run: |
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_exec.txt
          grep -E "executor ran [1-9][0-9]* expert ops itself, checked [1-9][0-9]*, mismatches 0" ident_exec/plugin.log    # the executor really ran (it steps aside silently on repacked weights)

      - name: Identity with GGML_CPU_TILED_MM_FORCE=1 (stock tiles every expert, so the executor must hand every op back) - API 3 rows
        if: matrix.api == '3'
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          GGML_CPU_TILED_MM_FORCE: "1"    # both servers
          IDENT_EXTRA: "--no-repack"
          IDENT_KEEP: ident_tiled_force
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2 MOE_CACHE_EXEC_CHECK=1"
        run: |
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_tiled_force.txt
          grep -q "GGML_CPU_TILED_MM_FORCE=1: every expert op is left to llama.cpp" ident_tiled_force/plugin.log

      - name: Identity with different thread counts for prompts and decode (-t 2 -tb 3; the plugin switches between two threadpools)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_EXTRA: "-t 2 -tb 3"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2"
        run: tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_tb.txt

      - name: Cache smaller than one op (1 MiB) - experts mapped from the model file instead of aborting, guard mode on
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_KEEP: ident_small_map
          IDENT_EXTRA: "--no-repack"      # mapping needs experts stored as in the file
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.001 MOE_CACHE_DIRECT=1 MOE_CACHE_GUARD=1"
        run: |
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_small_map.txt
          grep -E "cache smaller than one op: [1-9][0-9]* experts mapped" ident_small_map/plugin.log

      - name: Cache smaller than one op (1 MiB), executor forced on - experts loaded over the cache size instead of aborting
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_KEEP: ident_small_over
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.001 MOE_CACHE_EXEC=2 MOE_CACHE_EXEC_CHECK=1"
        run: |
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_small_over.txt
          grep -E "experts mapped from the model file, [1-9][0-9]* loaded over" ident_small_over/plugin.log
          grep -E "executor ran [1-9][0-9]* expert ops itself, checked [1-9][0-9]*, mismatches 0" ident_small_over/plugin.log

      - name: Logits at batch 8 (KL divergence vs stock), cache forced to evict, executor forced on
        env:
          LLAMA_PERPLEXITY: ${{ github.workspace }}/llama.cpp/build/bin/llama-perplexity
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          KL_EXTRA: "--no-repack"
          KL_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2"
        run: tests/kl_batch.sh granite.gguf --chunks 4 | tee identity_kl_batch8.txt

      - name: Tiny gpt-oss model (separate gate/up/down calls; random weights, converted with this llama.cpp's own script)
        run: |
          python3 -m pip install -q -r llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
          python3 -m pip install -q -e llama.cpp/gguf-py
          # a random-weight model with an untied output layer (llama.cpp's gpt-oss loader needs output.weight; the 41 MB tiny models tie it)
          R=tengomucho/tiny-random-gpt-oss; REV=2109d1ee033bb4191af6dd950fda542c9c351dc8; mkdir -p tiny-gptoss
          for f in config.json generation_config.json model.safetensors special_tokens_map.json tokenizer.json tokenizer_config.json; do
            curl -L -f -s -o tiny-gptoss/$f "https://huggingface.co/$R/resolve/$REV/$f"
          done
          python3 llama.cpp/convert_hf_to_gguf.py tiny-gptoss --outfile tiny-gptoss-f16.gguf --outtype f16
          # Q2_0: the executor takes IQ / Q2_0 expert weights by default (its own waits for experts still loading)
          llama.cpp/build/bin/llama-quantize tiny-gptoss-f16.gguf tiny-gptoss.gguf Q2_0
          # Q8_0: a bandwidth-bound type, so the executor hands fully resident graphs back to llama.cpp (the step-aside path and its wait)
          llama.cpp/build/bin/llama-quantize tiny-gptoss-f16.gguf tiny-gptoss-q8.gguf Q8_0
          ls -la tiny-gptoss.gguf tiny-gptoss-q8.gguf
          # does stock llama-server load it? (show its log either way)
          timeout 60 llama.cpp/build/bin/llama-server -m tiny-gptoss.gguf -c 2048 --port 8097 > tiny_srv.log 2>&1 || true
          grep -iE "error|failed|unknown|invalid|exception|model loaded|listening" tiny_srv.log | head -20 || true
          tail -15 tiny_srv.log

      - name: Identity on gpt-oss (Q2_0, executor graphs) with background reads delayed (catches a missing wait in the executor's own path)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.002 MOE_CACHE_TEST_READ_DELAY_US=2000"
          IDENT_EXTRA: "--no-repack"      # CPU-only builds repack the weights by default, and the executor stays out of repacked weights
          IDENT_KEEP: ident_gptoss
        run: |
          tests/identity.sh tiny-gptoss.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_gptoss_delay.txt || { tail -40 ident_gptoss/stock.log ident_gptoss/plugin.log 2>/dev/null; exit 1; }
          # a run where the executor did nothing proves nothing (this step does not reach the step-aside branch: Q2_0 graphs never step aside; next step)
          grep -qE "executor ran [1-9]" identity_gptoss_delay.txt || { echo "FAIL: the executor ran 0 ops"; exit 1; }

      - name: Identity on gpt-oss (Q8_0) with reads delayed - the executor steps aside and must wait for experts still loading (T45)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          # routing on with every pick kept (exact): an explicit routing mode keeps the executor for K-quant/legacy weights, so its graphs
          # load siblings in the background and then step aside to llama.cpp while those loads are still running. 8 MiB: a gate call's experts
          # plus their up/down siblings (~2.6 MB at ~213 KB each) must fit, else the siblings are skipped and the next call reads instead of stepping aside
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.008 MOE_CACHE_TEST_READ_DELAY_US=2000 MOE_CACHE_ROUTE=skip MOE_CACHE_ROUTE_KEEP=99"
          IDENT_EXTRA: "--no-repack"
          IDENT_KEEP: ident_gptoss_q8
        run: |
          tests/identity.sh tiny-gptoss-q8.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_gptoss_q8.txt || { tail -40 ident_gptoss_q8/plugin.log; exit 1; }
          grep -E "stepped aside \(all resident\) in [1-9][0-9]* graphs; [1-9][0-9]* of them waited" ident_gptoss_q8/plugin.log || { echo "FAIL: the step-aside wait was never needed, so this step proves nothing"; exit 1; }

      - name: Mutation check - a plugin built without the step-aside wait must FAIL the previous step
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build-mutant/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.008 MOE_CACHE_TEST_READ_DELAY_US=2000 MOE_CACHE_ROUTE=skip MOE_CACHE_ROUTE_KEEP=99"
          IDENT_EXTRA: "--no-repack"
        run: |
          if [ "${{ matrix.api }}" = 3 ]; then export GGML_API=3; fi
          MOE_CACHE_CXXFLAGS=-DMOE_CACHE_TEST_MUTANT_NO_STEPASIDE_WAIT BUILD_DIR=build-mutant ./build.sh --portable
          if tests/identity.sh tiny-gptoss-q8.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_gptoss_mutant.txt; then
            echo "FAIL: the mutant without the wait passed, so the step above does not cover it"; exit 1
          fi
          grep -qE "^identical prompts: [0-3]/4" identity_gptoss_mutant.txt || { echo "FAIL: the mutant failed for another reason (no token comparison)"; exit 1; }
          echo "OK: the mutant fails as it should"

      - name: Mutation checks - builds without the executor's flag wait / the tiled hand-back wait must FAIL their tests (I10)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          LLAMA_PERPLEXITY: ${{ github.workspace }}/llama.cpp/build/bin/llama-perplexity
          MOE_CACHE_STATS: "1"
        run: |
          if [ "${{ matrix.api }}" = 3 ]; then export GGML_API=3; fi
          MOE_CACHE_CXXFLAGS=-DMOE_CACHE_TEST_MUTANT_NO_EXEC_WAIT BUILD_DIR=build-mut-exec ./build.sh --portable
          MOE_CACHE_CXXFLAGS=-DMOE_CACHE_TEST_MUTANT_NO_TILED_WAIT BUILD_DIR=build-mut-tiled ./build.sh --portable
          # 1: executor graphs on the Q2_0 tiny gpt-oss with reads delayed 2 ms (same settings as the Q2_0 step above)
          if MOE_CACHE_LIB=$PWD/build-mut-exec/libggml-moe-cache.so IDENT_EXTRA="--no-repack" IDENT_PLUGIN_ENV="MOE_CACHE_SIZE_GIB=0.002 MOE_CACHE_TEST_READ_DELAY_US=2000" \
             tests/identity.sh tiny-gptoss.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_mut_exec.txt; then
            echo "FAIL: the mutant without the executor's flag wait passed"; exit 1; fi
          grep -qE "^identical prompts: [0-3]/4" identity_mut_exec.txt || { echo "FAIL: the exec mutant failed for another reason"; exit 1; }
          echo "OK: exec-wait mutant fails"
          # 2: batch-8 logits with forced eviction, executor forced, reads delayed (the tiled hand-back reads experts still loading without the wait)
          if MOE_CACHE_LIB=$PWD/build-mut-tiled/libggml-moe-cache.so KL_EXTRA="--no-repack" KL_PLUGIN_ENV="MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2 MOE_CACHE_TEST_READ_DELAY_US=2000" \
             tests/kl_batch.sh granite.gguf --chunks 4 | tee identity_mut_tiled.txt; then
            echo "FAIL: the mutant without the tiled hand-back wait passed"; exit 1; fi
          grep -q "FAIL: the plugin's logits differ" identity_mut_tiled.txt || { echo "FAIL: the tiled mutant failed for another reason"; exit 1; }
          echo "OK: tiled-wait mutant fails"

      - name: Logits at batch 8 with reads delayed (the real build must still give stock's logits; pairs with the tiled mutant above)
        env:
          LLAMA_PERPLEXITY: ${{ github.workspace }}/llama.cpp/build/bin/llama-perplexity
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          KL_EXTRA: "--no-repack"
          KL_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2 MOE_CACHE_TEST_READ_DELAY_US=2000"
        run: tests/kl_batch.sh granite.gguf --chunks 4 | tee identity_kl_batch8_delay.txt

      - name: Identity with guard mode (evicted pages inaccessible, so an unintercepted read crashes instead of reading zeros)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_EXTRA: "--no-repack"
          IDENT_KEEP: ident_guard
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_EXEC=2 MOE_CACHE_GUARD=1"
        run: |
          tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_guard.txt
          grep -E "executor ran [1-9][0-9]* expert ops itself" ident_guard/plugin.log

      - name: Identity with guard mode, two slots (each short prompt, 12-25 tokens, goes to the other slot; the PC crashed at the second request, slot 1)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2 MOE_CACHE_GUARD=1"
        run: tests/identity.sh granite.gguf --tokens 24 --ctx 4096 --np 2 --n-cpu-moe 999 | tee identity_guard_np2.txt

      - name: Repeated expert ids (a GPU top-k fed NaN repeats an index), two slots in parallel, executor byte-checked - the PC's request-2 crash
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
        run: tests/dup_ids.sh granite.gguf | tee dup_ids.txt

      - name: Mutant check - a build with the old expert count and no task split must fail the repeated-ids step
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
        run: |
          if [ "${{ matrix.api }}" = 3 ]; then export GGML_API=3; fi
          MOE_CACHE_CXXFLAGS=-DMOE_CACHE_TEST_MUTANT_DUP_IDS BUILD_DIR=build-mut-dup ./build.sh --portable
          if MOE_CACHE_LIB=$PWD/build-mut-dup/libggml-moe-cache.so IDENT_KEEP=mut_dup timeout 900 tests/dup_ids.sh granite.gguf 2>&1 | tee dup_ids_mutant.txt; then
            echo "FAIL: the mutant passed, so the repeated-ids step does not cover the overflow"; exit 1; fi
          # the overflow either reaches the column check or has already overwritten the heap and crashes (both seen in CI)
          grep -qE "an expert task of .* has [0-9]+ columns" mut_dup/plugin.log dup_ids_mutant.txt || grep -qE "Segmentation fault|FAIL: the server (died|is gone)" dup_ids_mutant.txt ||
            { echo "FAIL: the mutant failed for another reason"; tail -5 mut_dup/plugin.log; exit 1; }
          echo "OK: the mutant fails (column check or crash)"

      - name: Mutant check - a build that expects another op number must refuse to run (start-up layout check of the running ggml)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_STATS: "1"
          IDENT_KEEP: mut_abi
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=0.2"
        run: |
          if [ "${{ matrix.api }}" = 3 ]; then export GGML_API=3; fi
          MOE_CACHE_CXXFLAGS=-DMOE_CACHE_TEST_MUTANT_ABI BUILD_DIR=build-mut-abi ./build.sh --portable
          MOE_CACHE_LIB=$PWD/build-mut-abi/libggml-moe-cache.so tests/identity.sh granite.gguf --tokens 8 --ctx 2048 --n-cpu-moe 999 | tee abi_mutant.txt || true   # the refused plugin makes identity.sh exit 2: the greps decide
          grep -q "does not match the ggml headers this plugin was built with (op .* expected MUL_MAT_ID)" mut_abi/plugin.log ||
            { echo "FAIL: the mutant did not refuse"; grep "moe-cache:" mut_abi/plugin.log | head -5; exit 1; }
          if grep -q "does not match the ggml headers" ident_exec/plugin.log; then echo "FAIL: the real build refused"; exit 1; fi
          echo "OK: the layout check refuses a mismatch and passes the real build"

      - name: Reads straight into place, each read's range poisoned while it is in flight (what Windows shows other threads), executor byte-checked
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_DIRECT: "1"
          MOE_CACHE_TEST_POISON_READS: "1"
          MOE_CACHE_TEST_READ_DELAY_US: "2000"
          IDENT_KEEP: poison_reads
        run: |
          tests/dup_ids.sh granite.gguf 1 | tee poison_reads.txt
          grep -E "reads straight into place [1-9]" poison_reads/plugin.log

      - name: Mutant check - the old direct read over the pages shared with neighbouring experts must fail the poisoned-reads step
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_DIRECT: "1"
          MOE_CACHE_TEST_POISON_READS: "1"
          MOE_CACHE_TEST_READ_DELAY_US: "2000"
        run: |
          if [ "${{ matrix.api }}" = 3 ]; then export GGML_API=3; fi
          MOE_CACHE_CXXFLAGS=-DMOE_CACHE_TEST_MUTANT_DIRECT_SHARED BUILD_DIR=build-mut-shared ./build.sh --portable
          if MOE_CACHE_LIB=$PWD/build-mut-shared/libggml-moe-cache.so IDENT_KEEP=mut_poison timeout 900 tests/dup_ids.sh granite.gguf 1 2>&1 | tee poison_mutant.txt; then
            echo "FAIL: the mutant passed, so the poisoned-reads step does not cover reads over shared pages"; exit 1; fi
          grep -q "moe-cache: cache mode" mut_poison/plugin.log || { echo "FAIL: the mutant plugin was not active"; tail -5 mut_poison/plugin.log; exit 1; }
          echo "OK: the mutant fails (mismatch or crash)"

      - name: Noise floor - plugin loaded but disabled, no repacking (must equal stock; if it does not, the comparison itself is not deterministic)
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_DISABLE=1"
          IDENT_ALLOW_INACTIVE: "1"
        run: tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_floor.txt

      - name: Identity, cache enabled without eviction (2 GiB) and no repacking
        env:
          LLAMA_SERVER: ${{ github.workspace }}/llama.cpp/build/bin/llama-server
          MOE_CACHE_LIB: ${{ github.workspace }}/build/libggml-moe-cache.so
          MOE_CACHE_STATS: "1"
          IDENT_EXTRA: "--no-repack"
          IDENT_PLUGIN_ENV: "MOE_CACHE_SIZE_GIB=2"
        run: tests/identity.sh granite.gguf --tokens 24 --ctx 2048 --n-cpu-moe 999 | tee identity_noevict.txt

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-${{ matrix.name }}
          path: |
            identity_*.txt
            key_live*
            ident_small_*/plugin.log
