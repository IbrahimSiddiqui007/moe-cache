# Desktop app (Tauri 2 shell around the control page). Runs by hand (workflow_dispatch, which GitHub offers only once this file is on the default
# branch) on pull requests that touch desktop/ or this file, and on pushes to claude/desktop-* branches (so a desktop branch builds without a PR). Never on a tag.
# Design: docs/DESKTOP_APP_DESIGN.md. No signing of the installer (no code-signing certificate by decision);
# update-file signing (TAURI_SIGNING_PRIVATE_KEY) is added with the updater milestone.
name: desktop

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: Windows embeddable Python version
        default: "3.12.8"
      python_sha256:
        description: SHA-256 of python-<version>-embed-amd64.zip (from python.org); empty = the pin for 3.12.8 in the workflow; "none" = do not bundle Python (the app then needs MOE_CACHE_PYTHON)
        default: ""
  push:
    branches: ["claude/desktop-*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

env:
  # python.org's python-3.12.8-embed-amd64.zip, hash taken on 2026-11-03 from a download over https (no second source: python.org lists none)
  PY_VERSION: ${{ inputs.python_version || '3.12.8' }}
  PY_SHA256: ${{ inputs.python_sha256 || '8d3f33be9eb810f23c102f08475af2854e50484b8e4e06275e937be61ce3d2fb' }}

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kit:
    # the Windows kit (launcher, page, both plugin DLLs, the official llama.cpp Vulkan build) made by the repository's own script; the Windows app bundles it
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: mingw-w64 (UCRT when available, as windows.yml)
        run: |
          sudo apt-get update -q
          if sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-ucrt64 binutils-mingw-w64-x86-64 2>/dev/null && command -v x86_64-w64-mingw32ucrt-g++; then
            echo "MINGW_CXX=x86_64-w64-mingw32ucrt-g++" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
            echo "MINGW_CXX=x86_64-w64-mingw32-g++" >> "$GITHUB_ENV"
          fi
      - name: Windows kit
        run: tools/make_windows_kit.sh 0.0.0-desktop
      - name: Linux release tarball (the plugin .so and the official llama.cpp build; the ggml 0.26 one, API 3)
        run: tools/make_release.sh 0.0.0-desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-kit
          path: dist/moe-cache-v0.0.0-desktop-windows-x64.zip
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-kit-linux
          path: dist/moe-cache-v0.0.0-desktop-ggml0.26-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 3

  build:
    needs: kit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: appimage,deb
            py: python3
          - os: windows-2022
            bundles: nsis,msi
            py: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Cache Cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ matrix.os }}-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock') }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Stage the kit files
        shell: bash
        run: desktop/scripts/stage.sh

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: runner.os == 'Windows'
        with:
          name: desktop-kit
          path: kit-zip

      - name: Replace the staged kit with the Windows kit (plugin DLLs, llama.cpp Vulkan) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive kit-zip\moe-cache-v0.0.0-desktop-windows-x64.zip -DestinationPath "$env:RUNNER_TEMP\kit"
          $src = Get-ChildItem "$env:RUNNER_TEMP\kit" -Directory | Select-Object -First 1
          $dst = "desktop\src-tauri\resources\moe-cache"
          Get-ChildItem $dst -Force | Where-Object Name -ne ".gitkeep" | Remove-Item -Recurse -Force
          Copy-Item "$($src.FullName)\*" $dst -Recurse
          Remove-Item "$dst\moe-cache.bat", "$dst\moe-cache.exe", "$dst\bin\moe-cache-ui.bat" -ErrorAction SilentlyContinue
          Copy-Item desktop\app_entry.py $dst
          Get-ChildItem $dst | Select-Object Name | Format-Table -HideTableHeaders
          if (-not (Test-Path "$dst\llama\llama-server.exe") -or -not (Test-Path "$dst\ggml-moe-cache-api3.dll")) { throw "the kit lacks llama-server.exe or the API 3 DLL" }
          "{0:N1} MB staged" -f ((Get-ChildItem $dst -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: runner.os == 'Linux'
        with:
          name: desktop-kit-linux
          path: kit-linux

      - name: Replace the staged kit with the Linux kit (plugin .so, official llama.cpp) (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          d=desktop/src-tauri/resources/moe-cache
          t=$(mktemp -d); tar -xzf kit-linux/*.tar.gz -C "$t"; src=$(echo "$t"/*)
          find "$d" -mindepth 1 ! -name .gitkeep -delete
          mkdir -p "$d/build"
          cp -rL "$src/bin" "$src/planner" "$src/ui" "$src/profiles" "$src/llama" "$src/models.json" "$d/"    # -L: no symlinks in the bundle
          cp "$src/build/libggml-moe-cache.so" "$d/build/"
          rm -f "$d/bin/moe-cache-ui.bat"
          cp desktop/app_entry.py "$d/"
          test -x "$d/llama/llama-server" && test -f "$d/build/libggml-moe-cache.so"
          du -sh "$d"
          out=$(python3 "$d/bin/moe_cache.py" check 2>&1 || true); echo "$out"
          echo "$out" | grep -Eq 'llama-server +[^ ]*/llama/llama-server' || { echo "FAIL: check did not find the bundled llama-server"; exit 1; }
          echo "$out" | grep -q 'libggml-moe-cache.so' || { echo "FAIL: check did not find the bundled plugin"; exit 1; }

      - name: Bundle Python (Windows)
        if: runner.os == 'Windows' && env.PY_SHA256 != 'none'
        shell: pwsh
        run: desktop/scripts/fetch-python-win.ps1 -Version "$env:PY_VERSION" -Sha256 "$env:PY_SHA256"

      - name: Empty Python folder when none is bundled (Windows)
        if: runner.os == 'Windows' && env.PY_SHA256 == 'none'
        shell: bash
        run: mkdir -p desktop/src-tauri/resources/python && touch desktop/src-tauri/resources/python/.gitkeep

      - name: The bundled Python finds the kit's plugin and llama-server (Windows)
        if: runner.os == 'Windows' && env.PY_SHA256 != 'none'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"   # the checks write warnings to stderr; the pattern match below decides
          $out = & desktop\src-tauri\resources\python\python.exe desktop\src-tauri\resources\moe-cache\bin\moe_cache.py check 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch "ggml-moe-cache-api3.dll") { throw "check did not find the kit's API 3 DLL" }
          if ($out -notmatch "llama-server") { throw "check does not mention llama-server" }

      - name: Shell tests (Rust unit tests)
        working-directory: desktop/src-tauri
        shell: bash
        run: cargo test --locked

      - name: Shell contract test, no model (launcher started as the shell starts it)
        if: runner.os == 'Linux'
        shell: bash
        run: python3 desktop/tests/shell_contract_test.py

      - name: Shell contract test with the bundled Python (Windows)
        if: runner.os == 'Windows' && env.PY_SHA256 != 'none'
        shell: bash
        run: desktop/src-tauri/resources/python/python.exe desktop/tests/shell_contract_test.py

      # GUI-696: the signing key never sits in a step that installs packages. The CLI comes from the lockfile (npm ci fails when package.json and
      # package-lock.json disagree; --ignore-scripts keeps package install scripts from running), then the build step, which is the only one that sees the key.
      - name: Install the Tauri CLI from the lockfile (no secrets in this step)
        working-directory: desktop
        shell: bash
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Refuse the placeholder update key on a tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if head -c 11 desktop/src-tauri/update-pubkey.txt | grep -q PLACEHOLDER; then
            echo "desktop/src-tauri/update-pubkey.txt is still the PLACEHOLDER: a tagged build would ship an app that cannot verify updates"; exit 1
          fi

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          # update signing: only when the owner has added the key as a repository secret (docs/DESKTOP_APP_DESIGN.md, section 6); without it the build is unsigned and has no update files
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); echo "update files will be signed"; fi
          npx --no-install tauri build --bundles ${{ matrix.bundles }} "${extra[@]}"

      - name: Sizes
        shell: bash
        run: |
          echo "| file | bytes |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          find desktop/src-tauri/target/release/bundle -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.msi' -o -name '*-setup.exe' \) | while read -r f; do
            echo "$f $(wc -c < "$f")"; echo "| $(basename "$f") | $(wc -c < "$f") |" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moe-cache-desktop-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error
          retention-days: 7
