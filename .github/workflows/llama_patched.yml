# Builds llama.cpp b12064 plus patches/llama.cpp/*.patch (Windows Vulkan, Linux Vulkan).
# Runs when asked (push to the branch ci/llama-patched or ci/llama-patched-*; manual dispatch needs the file on main) and, since v0.3.8, as a called workflow of release.yml:
# the release kits (Windows zip, Linux tarball) bundle THESE artifacts, every patch built in and off. See patches/llama.cpp/README.md.
# Identity: windows-package and linux-identity answer three prompts at temperature 0 with the official b12064 build, with this build (all switches off) and with this
# build (0004, 0020, 0040 switches on); the answers must be byte-identical (tools/llama_identity_run.sh).
# Flags, runners and the Vulkan SDK version follow llama.cpp's own release.yml at the pin (jobs windows-cpu, windows, ubuntu-vulkan).
# Windows is two artifacts, as upstream: llama-server + CPU backends, and ggml-vulkan.dll. Put them in one folder. test-backend-ops is included: patches that change a shader run it on the AMD card first.
name: llama-patched
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [ci/llama-patched, 'ci/llama-patched-**']

env:
  LLAMA_COMMIT: 51fe42c5d14bfb9adf0612ff98a9ab79e0e7275c   # b12064
  VULKAN_VERSION: "1.4.357.0"
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON -DLLAMA_CONNECT=ON"

permissions:
  contents: read

jobs:
  windows-server:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false   # the patches must apply byte for byte
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          fetch-depth: 0   # the build number names the prebuilt UI and the version line
      - name: Apply the patches
        shell: bash
        run: tools/apply_llama_patches.sh llama.cpp
      - run: choco install ninja
      - name: Build
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake -DLLAMA_BUILD_BORINGSSL=ON -DGGML_NATIVE=OFF -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DGGML_OPENMP=ON -DGGML_OPENMP_FETCH=ON %CMAKE_ARGS% -DLLAMA_BUILD_TESTS=ON
          cmake --build build --config Release --target llama-server test-backend-ops
      - name: Version line
        shell: bash
        run: llama.cpp/build/bin/Release/llama-server.exe --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-patched-win-server-x64
          path: |
            llama.cpp/build/bin/Release/*.exe
            llama.cpp/build/bin/Release/*.dll

  windows-vulkan:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          fetch-depth: 0
      - name: Apply the patches
        shell: bash
        run: tools/apply_llama_patches.sh llama.cpp
      - name: Vulkan SDK
        run: |
          curl.exe --retry 5 --retry-all-errors --retry-delay 10 -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          # sha256 as LunarG publishes it (https://sdk.lunarg.com/sdk/sha/1.4.357.0/windows/vulkan_sdk.exe.txt, read 2026-11-03): a changed installer stops here (AUD-063). Update with VULKAN_VERSION.
          if ((Get-FileHash "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" -Algorithm SHA256).Hash -ne '81F474711E9042F4CD22B31B2F7A8870DB2E428B21586FB43DD80150BE97310D') { throw "VulkanSDK installer: wrong sha256 (VULKAN_VERSION changed? update the hash from LunarG's sha page)" }
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - run: choco install ninja
      - name: Build
        working-directory: llama.cpp
        run: |
          cmake -S . -B build -DGGML_VULKAN=ON -DGGML_NATIVE=OFF -DGGML_CPU=OFF -DGGML_BACKEND_DL=ON -DLLAMA_BUILD_BORINGSSL=ON
          cmake --build build --config Release --target ggml-vulkan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-patched-win-vulkan-x64
          path: llama.cpp/build/bin/Release/ggml-vulkan.dll

  # One zip for the Windows PC: the server + CPU backends from windows-server and ggml-vulkan.dll from windows-vulkan in one folder, with its sha256, after a
  # smoke test: the server starts and answers a short greedy completion with text. A CI runner has no GPU; the PC tests decide whether a patch stays.
  windows-package:
    needs: [windows-server, windows-vulkan]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llama-patched-win-server-x64
          path: pkg/llama-patched-win-x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llama-patched-win-vulkan-x64
          path: pkg/llama-patched-win-x64
      - name: Granite test model (pinned by sha256, as windows.yml)
        run: |
          Invoke-WebRequest -UseBasicParsing "https://huggingface.co/bartowski/granite-3.1-1b-a400m-instruct-GGUF/resolve/main/granite-3.1-1b-a400m-instruct-Q4_K_M.gguf" -OutFile granite.gguf
          $h = (Get-FileHash granite.gguf -Algorithm SHA256).Hash.ToLower()
          if ($h -ne "3a2ec1c2a78cb29d901e29bbf5162dcd03381e13803d2cbdcff838d4d08142eb") { throw "granite.gguf: wrong sha256 $h" }
      - name: Smoke test
        run: |
          $dir = "$PWD\pkg\llama-patched-win-x64"
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          if (-not (Test-Path "$dir\llama-server.exe")) { throw "no llama-server.exe in the package" }
          & "$dir\llama-server.exe" --version
          $body = '{"prompt":"The quick brown fox jumps over the lazy dog. The quick brown fox","n_predict":100,"temperature":0,"seed":1,"cache_prompt":false}'
          $p = Start-Process "$dir\llama-server.exe" -ArgumentList "-m","granite.gguf","-ngl","0","-ub","2048","-b","2048","-c","4096","--port","8101","--no-warmup" -RedirectStandardError "smoke.err" -RedirectStandardOutput "smoke.out" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 180; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8101/health").StatusCode -eq 200) { $ok = $true; break } } catch {}; Start-Sleep 1 }
          if (-not $ok) { Stop-Process -Id $p.Id -ErrorAction SilentlyContinue; Get-Content smoke.err -Tail 40; throw "smoke: server never became ready" }
          $r = Invoke-WebRequest -UseBasicParsing -Method Post -ContentType application/json -Body $body "http://127.0.0.1:8101/completion"
          Stop-Process -Id $p.Id
          $text = (($r.Content | ConvertFrom-Json).content)
          Write-Host "text: $text"
          if (-not $text -or $text.Length -lt 20) { throw "the smoke run produced no text" }
      - name: Official b12064 build (pinned by sha256) for the identity run
        run: |
          Invoke-WebRequest -UseBasicParsing "https://github.com/ggml-org/llama.cpp/releases/download/b12064/llama-b12064-bin-win-vulkan-x64.zip" -OutFile official.zip
          if ((Get-FileHash official.zip -Algorithm SHA256).Hash.ToLower() -ne 'e0fee991887711ce74cb9c1f7715a1234e27d94f13ccfc594dc01310e5da6e22') { throw "official.zip: wrong sha256" }
          Expand-Archive official.zip -DestinationPath official
      - name: Identity at temperature 0 - official, patched (switches off), patched (switches on)
        shell: bash
        run: |
          set -e
          mkdir -p ident
          tools/llama_identity_run.sh official/llama-server.exe granite.gguf 8111 ident/official.jsonl
          tools/llama_identity_run.sh pkg/llama-patched-win-x64/llama-server.exe granite.gguf 8112 ident/patched_off.jsonl
          tools/llama_identity_run.sh pkg/llama-patched-win-x64/llama-server.exe granite.gguf 8113 ident/patched_on.jsonl LLAMA_RESERVE_TOP=10 LLAMA_PLE_PREFETCH_AHEAD=1 LLAMA_SLOT_SAVE_ASYNC=1
          grep -q "LLAMA_RESERVE_TOP" ident/patched_on.jsonl.log || { echo "FAIL: the 0040 switch did not take effect (no LLAMA_RESERVE_TOP line): the on-arm proves nothing"; exit 1; }
          if grep -q "LLAMA_RESERVE_TOP" ident/patched_off.jsonl.log ident/official.jsonl.log; then echo "FAIL: 0040 printed with its switch off"; exit 1; fi
          cmp ident/official.jsonl ident/patched_off.jsonl || { echo "FAIL: patched build (switches off) answers differently from the official one"; exit 1; }
          cmp ident/official.jsonl ident/patched_on.jsonl || { echo "FAIL: patched build (switches on) answers differently from the official one"; exit 1; }
          echo "identity: 3 prompts x 100 tokens, official = patched off = patched on (byte-identical, text and token ids)"
      - name: Zip and sha256
        run: |
          Compress-Archive -Path pkg\llama-patched-win-x64 -DestinationPath llama-patched-win-x64.zip
          $h = (Get-FileHash llama-patched-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  llama-patched-win-x64.zip" | Out-File -Encoding ascii llama-patched-win-x64.zip.sha256
          Get-Content llama-patched-win-x64.zip.sha256
          (Get-Item llama-patched-win-x64.zip).Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-patched-win-x64-zip
          path: |
            llama-patched-win-x64.zip
            llama-patched-win-x64.zip.sha256

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_COMMIT }}
          path: llama.cpp
          fetch-depth: 0
      - name: Apply the patches
        run: tools/apply_llama_patches.sh llama.cpp
      - name: Vulkan SDK
        run: |
          # apt-key is deprecated and trusts the key for every repository: a keyring used only by the LunarG source (AUD-063)
          wget -qO - https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo gpg --dearmor -o /usr/share/keyrings/lunarg-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/lunarg-archive-keyring.gpg] https://packages.lunarg.com/vulkan jammy main" | sudo tee /etc/apt/sources.list.d/lunarg-vulkan-jammy.list
          sudo apt-get update -y
          sudo apt-get install -y build-essential mesa-vulkan-drivers vulkan-sdk libssl-dev
      - name: Build
        working-directory: llama.cpp
        run: |
          cmake -B build -DCMAKE_INSTALL_RPATH='$ORIGIN' -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DGGML_CPU_ALL_VARIANTS=ON -DGGML_VULKAN=ON $CMAKE_ARGS
          cmake --build build --config Release --target llama-server -j $(nproc)
          build/bin/llama-server --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-patched-linux-x64
          path: |
            llama.cpp/build/bin/llama-server
            llama.cpp/build/bin/*.so
      - name: Pack with the library symlinks kept (the tarball the Linux release bundles)
        run: |
          mkdir pkg
          cp -a llama.cpp/build/bin/llama-server llama.cpp/build/bin/*.so* pkg/
          tar -C pkg -czf llama-patched-linux-x64.tar.gz .
          sha256sum llama-patched-linux-x64.tar.gz | tee llama-patched-linux-x64.tar.gz.sha256
          ls -l pkg | head -40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llama-patched-linux-x64-tgz
          path: |
            llama-patched-linux-x64.tar.gz
            llama-patched-linux-x64.tar.gz.sha256

  linux-identity:
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: llama-patched-linux-x64-tgz
      - name: Unpack the patched build and fetch the official one (pinned by sha256) and the Granite test model
        run: |
          set -e
          sha256sum -c llama-patched-linux-x64.tar.gz.sha256
          mkdir patched && tar -C patched -xzf llama-patched-linux-x64.tar.gz
          curl -fsSL -o official.tgz https://github.com/ggml-org/llama.cpp/releases/download/b12064/llama-b12064-bin-ubuntu-vulkan-x64.tar.gz
          echo "156e0010e92079dd931c82f50cbf8be94de47d06dba637c29261bfda3f2ff297  official.tgz" | sha256sum -c -
          mkdir official && tar -C official -xzf official.tgz --strip-components=1
          curl -fsSL -o granite.gguf "https://huggingface.co/bartowski/granite-3.1-1b-a400m-instruct-GGUF/resolve/main/granite-3.1-1b-a400m-instruct-Q4_K_M.gguf"
          echo "3a2ec1c2a78cb29d901e29bbf5162dcd03381e13803d2cbdcff838d4d08142eb  granite.gguf" | sha256sum -c -
          patched/llama-server --version
      - name: Identity at temperature 0 - official, patched (switches off), patched (switches on)
        run: |
          set -e
          mkdir -p ident
          tools/llama_identity_run.sh official/llama-server granite.gguf 8111 ident/official.jsonl
          tools/llama_identity_run.sh patched/llama-server granite.gguf 8112 ident/patched_off.jsonl
          tools/llama_identity_run.sh patched/llama-server granite.gguf 8113 ident/patched_on.jsonl LLAMA_RESERVE_TOP=10 LLAMA_PLE_PREFETCH_AHEAD=1 LLAMA_SLOT_SAVE_ASYNC=1
          grep -q "LLAMA_RESERVE_TOP" ident/patched_on.jsonl.log || { echo "FAIL: the 0040 switch did not take effect (no LLAMA_RESERVE_TOP line): the on-arm proves nothing"; exit 1; }
          if grep -q "LLAMA_RESERVE_TOP" ident/patched_off.jsonl.log ident/official.jsonl.log; then echo "FAIL: 0040 printed with its switch off"; exit 1; fi
          cmp ident/official.jsonl ident/patched_off.jsonl || { echo "FAIL: patched build (switches off) answers differently from the official one"; exit 1; }
          cmp ident/official.jsonl ident/patched_on.jsonl || { echo "FAIL: patched build (switches on) answers differently from the official one"; exit 1; }
          echo "identity: 3 prompts x 100 tokens, official = patched off = patched on (byte-identical, text and token ids)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: llama-patched-linux-identity
          path: ident/
