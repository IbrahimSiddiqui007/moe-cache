# Release workflow: builds the portable plugin from the tagged commit on a clean GitHub runner, signs the tarball with a GitHub build
# attestation (provenance: which commit and workflow produced it) and attaches it to the release; the windows-kit job does the same for the Windows zip.
#   push a tag v0.1.3        -> build, attest, draft release; windows-kit adds the Windows zip; the publish job then makes it public (latest, unless the tag has a
#                               suffix like -beta1: then pre-release, not latest)
#   Actions tab -> Run workflow -> build only (not attested); the tarball is kept as a workflow artifact, nothing is published
# Users verify a download with:  gh attestation verify moe-cache-v0.1.3-linux-x86_64.tar.gz -R IbrahimSiddiqui007/moe-cache
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash     # bash -eo pipefail: without it "kernel_check | tee" hides a failing kernel check

jobs:
  build:
    # Ubuntu 22.04 on purpose: the tarball then needs glibc 2.34 or newer (measured; checked below after the build) and libstdc++ of GCC 12 or newer
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # create the release and upload files
      id-token: write       # sign the attestation
      attestations: write
      actions: read         # the gate below reads the identity and windows runs of this commit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # the write token must not sit in .git/config while the build and later actions run

      - name: Gate (tags only) - identity, windows and quick passed on this commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # quick runs on every push to experimental/main; run identity and windows on the tag first: gh workflow run identity.yml --ref vX.Y.Z; gh workflow run windows.yml --ref vX.Y.Z
          for w in identity.yml windows.yml quick.yml; do
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w "$w" -c "$GITHUB_SHA" -s success --json databaseId --jq length)
            [ "${n:-0}" -ge 1 ] || { echo "no successful $w run on $GITHUB_SHA: run it on this tag first, then re-run this workflow"; exit 1; }
            echo "$w passed on $GITHUB_SHA"
          done

      - name: Check scripts
        run: |
          for f in install.sh build.sh bin/moe-cache-* bin/_moe_cache_env.sh tests/*.sh tools/*.sh; do case "$f" in *.bat) continue;; esac; bash -n "$f"; done   # bin/moe-cache-ui.bat is not a shell script
          python3 -m py_compile bin/*.py planner/*.py tests/ident.py     # every launcher part (the UI and on-demand were left out before)
          # a tagged release must not install an older moe-cache when install.sh is run on its own
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            grep -q "MOE_CACHE_REF:-${GITHUB_REF_NAME}}" install.sh || { echo "install.sh MOE_CACHE_REF does not match ${GITHUB_REF_NAME}: bump it with the version"; exit 1; }
          fi

      - name: Q2_0 kernel is bit-exact (no model needed)
        run: |
          g++ -O2 -std=c++17 -Isrc tests/kernel_check.cpp -o /tmp/kernel_check -ldl
          /tmp/kernel_check | tee /tmp/kc.txt
          grep -q "mismatches with fused multiply-add 0," /tmp/kc.txt

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"; fi

      - name: Build tarball (from a clean export of this commit)
        env:
          V: ${{ steps.v.outputs.version }}
        run: tools/make_release.sh "$V"

      - name: The ggml0.26 tarball carries the official llama.cpp and the launcher finds it (no model); the API-2 tarball does not
        run: |
          set -e
          if command -v llama-server >/dev/null; then echo "FAIL: a llama-server is on this runner's PATH: the test would not prove the bundled one is found"; exit 1; fi
          t=$(ls dist/moe-cache-v*-ggml0.26-linux-x86_64.tar.gz); d=$(mktemp -d); tar -C "$d" -xzf "$t"; r=$(ls -d "$d"/moe-cache-v*)
          test -x "$r/llama/llama-server" && test -f "$r/llama/LICENSE-llama.cpp.txt" && test -f "$r/llama/README-moe-cache.txt" || { echo "FAIL: llama/ is incomplete in $t"; ls "$r/llama" | head; exit 1; }
          out=$(cd "$r" && env -u LLAMA_SERVER HOME="$d/home" XDG_CACHE_HOME="$d/xdg" python3 bin/moe_cache.py check 2>&1 || true)
          echo "$out" | head -20
          echo "$out" | grep -Eq 'llama-server +[^ ]*/llama/llama-server' || { echo "FAIL: moe_cache.py check did not find the bundled llama-server"; exit 1; }
          if echo "$out" | grep -Eq '\[FAIL\] +(llama-server|ggml version|shared ggml)'; then echo "FAIL: check rejects the bundled llama.cpp"; exit 1; fi
          for t2 in dist/moe-cache-v*-linux-x86_64.tar.gz; do
            case "$t2" in *-ggml0.26-*) continue;; esac
            if tar -tzf "$t2" | grep -q '/llama/llama-server'; then echo "FAIL: the API-2 tarball must not carry a llama.cpp build"; exit 1; fi
          done
          rm -rf "$d"

      - name: The prebuilt libraries need no newer glibc / libstdc++ than README and QUICKSTART say (glibc 2.34, libstdc++ of GCC 12)
        run: |
          for t in dist/moe-cache-v*-linux-x86_64.tar.gz; do
            d=$(mktemp -d); tar -C "$d" -xzf "$t" --wildcards '*/build/libggml-moe-cache.so'
            so=$(ls "$d"/*/build/libggml-moe-cache.so)
            g=$(objdump -T "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' | sed 's/GLIBC_//' | sort -V | tail -1)
            x=$(objdump -T "$so" | grep -oE 'GLIBCXX_[0-9.]+[0-9]' | sed 's/GLIBCXX_//' | sort -V | tail -1)
            echo "$t: needs glibc $g, libstdc++ GLIBCXX_${x:-none}"
            [ "$(printf '%s\n' "$g" 2.34 | sort -V | tail -1)" = 2.34 ] || { echo "FAIL: $t needs glibc $g; README/QUICKSTART say 2.34 or newer"; exit 1; }
            [ -z "$x" ] || [ "$(printf '%s\n' "$x" 3.4.30 | sort -V | tail -1)" = 3.4.30 ] || { echo "FAIL: $t needs GLIBCXX_$x; the docs say libstdc++ of GCC 12"; exit 1; }
            rm -rf "$d"
          done

      - name: Installers (the one-line installs; install.ps1 gets this release's version baked in)
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          set -e
          cp install.sh dist/install.sh
          sed "s/@VERSION@/$V/g" install.ps1 > dist/install.ps1
          grep -q "\[string\]\$Version = '$V'" dist/install.ps1 || { echo "FAIL: install.ps1 did not get version $V"; exit 1; }
          if grep -q '@VERSION@' dist/install.ps1; then echo "FAIL: install.ps1 still has the placeholder"; exit 1; fi
          grep -q "MOE_CACHE_REF:-v$V}" dist/install.sh || [ "$V" = 0.0.0-ci ] || { echo "FAIL: install.sh does not name v$V"; exit 1; }
          bash -n dist/install.sh

      - name: Attest build provenance
        if: github.ref_type == 'tag'   # a manual run on a branch must not get the same signature as a release
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/moe-cache-v*-linux-x86_64.tar.gz
            dist/install.sh
            dist/install.ps1

      - name: Keep the files as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moe-cache-release-files
          path: |
            dist/moe-cache-v*-linux-x86_64.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/install.ps1

      - name: Create the DRAFT release with the Linux files (tags only; the publish job makes it public once the Windows kit is attached)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="Prebuilt plugin, Linux x86-64, built by GitHub Actions from this tag. Verify the download: gh attestation verify <tarball> -R ${GITHUB_REPOSITORY}. Windows: the windows-x64 zip (experimental). Not tested: macOS. Start with bin/moe-cache-check."
          # a draft is not found by tag name through every API, so look it up in the list (a re-run of this workflow finds its own draft or an existing release)
          if [ -n "$(gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq ".[] | select(.tagName==\"$TAG\") | .tagName")" ]; then
            gh release upload "$TAG" dist/moe-cache-v*-linux-x86_64.tar.gz dist/SHA256SUMS dist/install.sh dist/install.ps1 --clobber
          else
            # notes: docs/RELEASE_NOTES_<tag>.md when it exists (written for the release), else the short text above
            if [ -f "docs/RELEASE_NOTES_$TAG.md" ]; then N=(--notes-file "docs/RELEASE_NOTES_$TAG.md"); else N=(--notes "$NOTES" --generate-notes); fi
            # never --latest here: the release is a draft until the publish job has both the Linux files and the Windows kit
            gh release create "$TAG" --verify-tag --draft --title "moe-cache $TAG (beta)" "${N[@]}" \
              dist/moe-cache-v*-linux-x86_64.tar.gz dist/SHA256SUMS dist/install.sh dist/install.ps1
          fi

  windows-kit:
    # the Windows kit (tools/make_windows_kit.sh): both DLLs, the launcher, the control page, the one-click .bat; attached to the release after the Linux job
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false   # as in the build job: the write token must not sit in .git/config while the kit is built

      - name: mingw-w64 (UCRT when available, as windows.yml)
        run: |
          sudo apt-get update -q
          if sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-ucrt64 binutils-mingw-w64-x86-64 2>/dev/null && command -v x86_64-w64-mingw32ucrt-g++; then
            echo "MINGW_CXX=x86_64-w64-mingw32ucrt-g++" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -q --no-install-recommends g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
            echo "MINGW_CXX=x86_64-w64-mingw32-g++" >> "$GITHUB_ENV"
          fi

      - name: Build the kit
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V=0.0.0-ci; fi
          tools/make_windows_kit.sh "$V"
          python3 packaging/fill_manifests.py "dist/moe-cache-v$V-windows-x64.zip"   # scoop / winget manifests (a check here; packages.yml publishes them after the release)

      - name: Attest build provenance
        if: github.ref_type == 'tag'   # as in the build job: a manual run on a branch must not get the same signature as a release
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/moe-cache-v*-windows-x64.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: moe-cache-windows-kit
          path: |
            dist/moe-cache-v*-windows-x64.zip
            dist/SHA256SUMS-windows
            dist/packaging/

      - name: Attach to the release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/moe-cache-v*-windows-x64.zip dist/SHA256SUMS-windows --clobber

  publish:
    # the last step: only now does the release become public (and "latest"); until then releases/latest/download/ still points at the previous version.
    # a failed build or Windows kit leaves a draft that nobody sees; fix, then re-run the workflow
    if: github.ref_type == 'tag'
    needs: [build, windows-kit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check both sets of files are attached, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          V="${TAG#v}"
          assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for pat in "moe-cache-v$V-linux-x86_64.tar.gz" "SHA256SUMS" "install.sh" "install.ps1" "moe-cache-v$V-windows-x64.zip" "SHA256SUMS-windows"; do
            echo "$assets" | grep -Fxq "$pat" || { echo "FAIL: $pat is not attached to $TAG; the release stays a draft"; exit 1; }
          done
          # a tag with a suffix (v0.3.6-beta1, v0.3.6-rc1) is a pre-release and never "latest" (it also keeps packages.yml from sending it to winget)
          case "$V" in
            *-*) gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false ;;
            *)   gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest ;;
          esac
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '"published: draft=\(.isDraft) prerelease=\(.isPrerelease)"'
