# Release workflow: builds the portable plugin from the tagged commit on a clean GitHub runner, signs the tarball with a GitHub build
# attestation (provenance: which commit and workflow produced it) and attaches it to the release.
#   push a tag v0.1.3        -> build, attest, publish the release (pre-release while the project is alpha)
#   Actions tab -> Run workflow -> build and attest only; the tarball is kept as a workflow artifact, nothing is published
# Users verify a download with:  gh attestation verify moe-cache-v0.1.3-linux-x86_64.tar.gz -R IbrahimSiddiqui007/moe-cache
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Ubuntu 22.04 on purpose: the tarball then needs only glibc 2.34 or older and libstdc++ of GCC 11 or newer
    runs-on: ubuntu-22.04
    permissions:
      contents: write       # create the release and upload files
      id-token: write       # sign the attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts
        run: |
          for f in install.sh build.sh bin/* tests/*.sh tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile planner/plan.py bench/moe_bench.py tests/ident.py

      - name: Version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "version=0.0.0-ci" >> "$GITHUB_OUTPUT"; fi

      - name: Build tarball (from a clean export of this commit)
        env:
          V: ${{ steps.v.outputs.version }}
        run: tools/make_release.sh "$V"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/moe-cache-v*-linux-x86_64.tar.gz

      - name: Keep the files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moe-cache-release-files
          path: |
            dist/moe-cache-v*-linux-x86_64.tar.gz
            dist/SHA256SUMS

      - name: Publish release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="Prebuilt plugin, Linux x86-64, built by GitHub Actions from this tag. Verify the download: gh attestation verify <tarball> -R ${GITHUB_REPOSITORY}. Not tested: AMD, Windows, macOS. Start with bin/moe-cache-check."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/moe-cache-v*-linux-x86_64.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" --verify-tag --prerelease --title "moe-cache $TAG (alpha)" --notes "$NOTES" --generate-notes \
              dist/moe-cache-v*-linux-x86_64.tar.gz dist/SHA256SUMS
          fi
