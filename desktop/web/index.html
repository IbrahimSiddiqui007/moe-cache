<!doctype html>
<meta charset="utf-8">
<title>moe-cache</title>
<meta name="color-scheme" content="light dark">
<style>
  body { font: 15px system-ui, sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
  #msg { text-align: center; max-width: 34em; padding: 1em; }
  pre { text-align: left; white-space: pre-wrap; font-size: 12px; opacity: .8; }
</style>
<div id="msg"><p id="t">Starting moe-cache…</p><pre id="d"></pre></div>
<script>
  // The shell shows this page until the control-page server answers, then replaces it with the server's address.
  // On a failure it calls window.__moeFail(text) so the user sees why instead of an empty window.
  window.__moeFail = function (text) {
    document.getElementById("t").textContent = "moe-cache could not start its control page.";
    document.getElementById("d").textContent = text;
  };
</script>
