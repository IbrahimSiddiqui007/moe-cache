[package]
name = "moe-cache-desktop"
version = "0.0.0"
description = "moe-cache desktop app: a Tauri 2 shell around the moe-cache control page"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
